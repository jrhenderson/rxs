# ──────────────────────────────────────────────
# Query
# ──────────────────────────────────────────────

type Query {
  # ── Tag ──
  tag(where: TagWhereUniqueInput!): Tag
  tags(
    where: TagWhereInput
    orderBy: [TagOrderByInput!]
    take: Int
    skip: Int
  ): [Tag!]
  tagsCount(where: TagWhereInput): Int

  # ── Site ──
  site(where: SiteWhereUniqueInput!): Site
  sites(
    where: SiteWhereInput
    orderBy: [SiteOrderByInput!]
    take: Int
    skip: Int
  ): [Site!]
  sitesCount(where: SiteWhereInput): Int

  # ── Page ──
  page(where: PageWhereUniqueInput!): Page
  pages(
    where: PageWhereInput
    orderBy: [PageOrderByInput!]
    take: Int
    skip: Int
  ): [Page!]
  pagesCount(where: PageWhereInput): Int

  # ── Author ──
  author(where: AuthorWhereUniqueInput!): Author
  authors(
    where: AuthorWhereInput
    orderBy: [AuthorOrderByInput!]
    take: Int
    skip: Int
  ): [Author!]
  authorsCount(where: AuthorWhereInput): Int

  # ── Profile ──
  profile(where: ProfileWhereUniqueInput!): Profile
  profiles(
    where: ProfileWhereInput
    orderBy: [ProfileOrderByInput!]
    take: Int
    skip: Int
  ): [Profile!]
  profilesCount(where: ProfileWhereInput): Int

  # ── TeamProfile ──
  teamProfile(where: TeamProfileWhereUniqueInput!): TeamProfile
  teamProfiles(
    where: TeamProfileWhereInput
    orderBy: [TeamProfileOrderByInput!]
    take: Int
    skip: Int
  ): [TeamProfile!]
  teamProfilesCount(where: TeamProfileWhereInput): Int

  # ── User ──
  user(where: UserWhereUniqueInput!): User
  users(
    where: UserWhereInput
    orderBy: [UserOrderByInput!]
    take: Int
    skip: Int
  ): [User!]
  usersCount(where: UserWhereInput): Int

  # ── MatchDay ──
  matchDay(where: MatchDayWhereUniqueInput!): MatchDay
  matchDays(
    where: MatchDayWhereInput
    orderBy: [MatchDayOrderByInput!]
    take: Int
    skip: Int
  ): [MatchDay!]
  matchDaysCount(where: MatchDayWhereInput): Int

  # ── Fixture ──
  fixture(where: FixtureWhereUniqueInput!): Fixture
  fixtures(
    where: FixtureWhereInput
    orderBy: [FixtureOrderByInput!]
    take: Int
    skip: Int
  ): [Fixture!]
  fixturesCount(where: FixtureWhereInput): Int

  # ── OptaCompetition ──
  optaCompetition(where: OptaCompetitionWhereUniqueInput!): OptaCompetition
  optaCompetitions(
    where: OptaCompetitionWhereInput
    orderBy: [OptaCompetitionOrderByInput!]
    take: Int
    skip: Int
  ): [OptaCompetition!]
  optaCompetitionsCount(where: OptaCompetitionWhereInput): Int

  # ── OptaTeam ──
  optaTeam(where: OptaTeamWhereUniqueInput!): OptaTeam
  optaTeams(
    where: OptaTeamWhereInput
    orderBy: [OptaTeamOrderByInput!]
    take: Int
    skip: Int
  ): [OptaTeam!]
  optaTeamsCount(where: OptaTeamWhereInput): Int

  # ── BroadcastPartner ──
  broadcastPartner(where: BroadcastPartnerWhereUniqueInput!): BroadcastPartner
  broadcastPartners(
    where: BroadcastPartnerWhereInput
    orderBy: [BroadcastPartnerOrderByInput!]
    take: Int
    skip: Int
  ): [BroadcastPartner!]
  broadcastPartnersCount(where: BroadcastPartnerWhereInput): Int

  # ── Opta data resolvers ──

  # Fixtures and results for a team, club, or competition entity
  getEntityFixturesAndResults(
    entityId: Int
    entityType: String
    season: String
    comps: [CompInput]
    teams: [String]
    # "fixtures" or "results"
    type: String
    limit: Int
    skip: Int
  ): [FixtureItem]

  # Single fixture item (no args confirmed)
  getFixtureItem: FixtureItem

  # List of fixture items filtered by competition
  getFixtureItems(comps: [CompInput]): [FixtureItem]

  # Returns all competitions (uses Opta data, not Keystone CRUD)
  getCompetitions: [Competition]

  # Competition metadata for a specific comp
  getCompMeta(comp: CompInput): Competition

  # Teams in a competition
  getCompTeams(comp: CompInput): CompTeams

  # Competition ladder / standings
  compLadder(comp: CompInput): Ladder

  # Site entity configuration as free-form JSON
  getEntitySiteDetails: JSON

  # Comments for a media item (separate MongoDB service)
  getComments(mediaId: String): [MediaComment]

  # ── Auth / meta ──
  authenticatedItem: AuthenticatedItem
  keystone: KeystoneMeta!
}

# ──────────────────────────────────────────────
# Mutation
# ──────────────────────────────────────────────

type Mutation {
  # ── Tag ──
  createTag(data: TagCreateInput!): Tag
  createTags(data: [TagCreateInput!]!): [Tag]
  updateTag(where: TagWhereUniqueInput!, data: TagUpdateInput!): Tag
  updateTags(data: [TagUpdateArgs!]!): [Tag]
  deleteTag(where: TagWhereUniqueInput!): Tag
