# GraphQL Schema for https://rugby-au-cms.graphcdn.app/graphql
# Reverse-engineered via field probing (introspection is disabled)
# Backend: Keystone.js v6 CMS with custom Opta data resolvers
# Confidence: HIGH for confirmed fields, INFERRED for input types/mutations

scalar DateTime
scalar JSON
scalar Upload

# ──────────────────────────────────────────────
# Keystone document field types (rich text)
# ──────────────────────────────────────────────
type Profile_bio_Document {
  document(hydrateRelationships: Boolean): JSON
}

type Page_content_Document {
  document(hydrateRelationships: Boolean): JSON
}

type MatchDay_content_Document {
  document(hydrateRelationships: Boolean): JSON
}

# ──────────────────────────────────────────────
# Keystone CMS types
# ──────────────────────────────────────────────

type Tag {
  id: ID!
  name: String
  slug: String
  createdAt: DateTime
  updatedAt: DateTime
}

type Site {
  id: ID!
  name: String
  slug: String
}

type Page {
  id: ID!
  title: String
  slug: String
  description: String
  content: Page_content_Document
  createdAt: DateTime
  updatedAt: DateTime
}

type Author {
  id: ID!
  name: String
  bio: String
  photoURL: String
  createdAt: DateTime
  updatedAt: DateTime
}

type Profile {
  id: ID!
  name: String
  slug: String
  bio: Profile_bio_Document
  caps: Int
  height: Int
  weight: Int
  twitter: String
  position: String
  club: String
  retired: Boolean
  debut: String
  # JSON array: [{ field: String, value: String, highlightStat: Boolean }]
  fields: JSON
  # JSON array of social profile objects
  socials: JSON
  school: String
  teams: [TeamProfile!]
  createdAt: DateTime
  updatedAt: DateTime
}

type TeamProfile {
  id: ID!
  # Opta team ID stored as string
  slug: String
  # Opta team ID stored as string (same value as slug)
  team: String
  season: String
  createdAt: DateTime
  updatedAt: DateTime
}

type User {
  id: ID!
  name: String
  email: String
  role: String
  nationalId: String
  createdAt: DateTime
}

type BroadcastPartner {
  id: ID!
  name: String
  link: String
  # URL to the partner's logo image
  photoId: String
  fixtures: [Fixture!]
  createdAt: DateTime
  updatedAt: DateTime
}

type FixturePage {
  # The CMS Fixture linked to this page
  fixture: Fixture
  type: String
}

type Fixture {
  id: ID!
  matchDay: MatchDay
  banner: String
  # Opta fixture ID (e.g. "356171")
  fixtureId: String
  # Human-readable label (e.g. "Rebels vs NSW Waratahs - Round 5 - 356171")
  fixtureLabel: String
  fixturePages: [FixturePage!]
  broadcastPartners: [BroadcastPartner!]
  ticketURL: String
  ticketsAvailableDate: DateTime
  isSoldOut: Boolean
  radioURL: String
  radioStart: DateTime
  radioEnd: DateTime
  streamURL: String
  streamStart: DateTime
  streamEnd: DateTime
  createdAt: DateTime
  updatedAt: DateTime
}

type MatchDay {
  id: ID!
  title: String
  day: String
  content: MatchDay_content_Document
  publishStatus: String
  fixtures: [Fixture!]
  createdAt: DateTime
  updatedAt: DateTime
}

type OptaCompetition {
  id: ID!
  name: String
  # JSON array of season identifiers
  season: JSON
  # Opta competition ID
  competitionId: String
  # "1" = Opta, "2" = other provider
  sourceType: String
  banner: String
  createdAt: DateTime
  updatedAt: DateTime
}

type OptaTeam {
  id: ID!
  name: String
  # Opta team ID
  teamId: String
  createdAt: DateTime
  updatedAt: DateTime
}

# ──────────────────────────────────────────────
# Custom / Opta data resolver types
# ──────────────────────────────────────────────

# A fixture from the Opta data feed, enriched with CMS metadata via fixtureMeta
type FixtureItem {
  id: String
  compId: String
  compName: String
  dateTime: String
  # Alternate date field
  gameDate: String
  group: String
  isLive: Boolean
  isBye: Boolean
  round: String
  roundType: String
  roundLabel: String
  season: String
  status: String
  venue: String
  venueId: String
  sourceType: String
  matchLabel: String
  homeTeam: Team
  awayTeam: Team
  # CMS metadata: tickets, streaming, broadcast partners
  fixtureMeta: Fixture
}

# Team as returned by Opta data resolvers
type Team {
  id: String
  name: String
  # Opta team ID
  teamId: String
  # Match score (only present on results)
  score: Int
  # URL to team crest/badge image
  crest: String
}

# Competition from Opta data (returned by getCompetitions / getCompMeta)
type Competition {
  id: String
  name: String
  teams: [Team]
  sourceType: String
}

# Team list returned by getCompTeams
type CompTeams {
  id: String
  name: String
  crest: String
}

# Competition standings / ladder
type Ladder {
  id: String
  hasPools: Boolean
  ladderPools: [LadderPool]
}

type LadderPool {
  id: String
  poolName: String
  teams: [LadderTeam]
}

# A team's row in a competition ladder (exact stat fields are inferred)
type LadderTeam {
  id: String
  name: String
  crest: String
  position: Int
  played: Int
  won: Int
  lost: Int
  drawn: Int
  pointsFor: Int
  pointsAgainst: Int
  pointsDifference: Int
  bonusPoints: Int
  points: Int
}

# Comments backed by a separate MongoDB service (uses _id not id)
type MediaComment {
  _id: ID
  comment: String
  author: MediaCommentAuthor
  mediaId: String
  createdAt: DateTime
  replies: [MediaCommentReply]
}

type MediaCommentAuthor {
  _id: ID
  firstname: String
  lastname: String
}

type MediaCommentReply {
  comment: String
  author: MediaCommentAuthor
  createdAt: DateTime
}

# ──────────────────────────────────────────────
# Auth types
# ──────────────────────────────────────────────

union AuthenticatedItem = User

type UserAuthenticationWithPasswordSuccess {
  sessionToken: String!
  item: User!
}

type UserAuthenticationWithPasswordFailure {
  message: String!
}

union UserAuthenticationWithPasswordResult =
    UserAuthenticationWithPasswordSuccess
  | UserAuthenticationWithPasswordFailure

input CreateInitialUserInput {
  name: String
  email: String!
  password: String!
}

